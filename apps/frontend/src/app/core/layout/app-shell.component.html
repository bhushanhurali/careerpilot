<mat-toolbar color="primary">
  <a class="brand-link" routerLink="/companies">CareerPilot</a>
  <nav class="primary-nav" aria-label="Primary navigation">
    <a
      mat-button
      routerLink="/dashboard"
      routerLinkActive="active-link"
      ariaCurrentWhenActive="page"
      >Dashboard</a
    >
    <a mat-button routerLink="/companies" routerLinkActive="active-link">Companies</a>
    <a mat-button routerLink="/applications" routerLinkActive="active-link">Applications</a>
    <a mat-button routerLink="/tasks" routerLinkActive="active-link">Tasks</a>
    <a mat-button routerLink="/resumes" routerLinkActive="active-link" ariaCurrentWhenActive="page"
      >Resumes</a
    >
  </nav>
  <span class="flex-1"></span>
  @switch (authStore.status()) {
    @case ('authenticated') {
      <span class="user-name">{{ authStore.displayName() }}</span>
      <cp-theme-switcher />
      <a
        mat-icon-button
        routerLink="/notifications"
        routerLinkActive="active-link"
        ariaCurrentWhenActive="page"
        [attr.aria-label]="
          notificationStore.unreadCount() === null
            ? 'Notifications'
            : 'Notifications, ' + notificationStore.unreadCount() + ' unread'
        "
      >
        <mat-icon
          [matBadge]="
            (notificationStore.unreadCount() ?? 0) > 99 ? '99+' : notificationStore.unreadCount()
          "
          [matBadgeHidden]="!notificationStore.unreadCount()"
          matBadgeSize="small"
          >notifications</mat-icon
        >
      </a>
      <button mat-icon-button type="button" aria-label="Sign out" (click)="logout()">
        <mat-icon>logout</mat-icon>
      </button>
    }
    @case ('unknown') {
      <span class="user-name">Restoring session...</span>
    }
  }
</mat-toolbar>

<main class="app-shell__content">
  <router-outlet />
</main>
