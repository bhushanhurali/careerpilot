<div class="auth-layout flex min-h-dvh flex-col">
  <header class="auth-bar flex items-center justify-between gap-4">
    <a class="auth-brand flex items-center gap-2" routerLink="/">
      <mat-icon>{{ brand.icon }}</mat-icon>
      {{ brand.name }}
    </a>
    <cp-theme-switcher />
  </header>
  <main class="auth-main grid flex-1 place-items-center">
    <section class="auth-panel w-full min-w-0" aria-labelledby="auth-heading">
      <h1 id="auth-heading">{{ heading() }}</h1>
      <ng-content />
    </section>
  </main>
</div>
