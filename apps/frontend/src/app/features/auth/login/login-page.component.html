<cp-auth-layout heading="Sign in">
  <form
    class="grid gap-2"
    [attr.aria-busy]="isSubmitting()"
    [formGroup]="form"
    (ngSubmit)="submit()"
  >
    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <input matInput type="email" formControlName="email" autocomplete="email" />
      @if (emailError()) {
        <mat-error>{{ emailError() }}</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Password</mat-label>
      <input
        matInput
        [type]="hidePassword() ? 'password' : 'text'"
        formControlName="password"
        autocomplete="current-password"
      />
      <button
        mat-icon-button
        matSuffix
        type="button"
        [attr.aria-label]="hidePassword() ? 'Show password' : 'Hide password'"
        (click)="hidePassword.set(!hidePassword())"
      >
        <mat-icon>{{ hidePassword() ? 'visibility' : 'visibility_off' }}</mat-icon>
      </button>
      @if (passwordError()) {
        <mat-error>{{ passwordError() }}</mat-error>
      }
    </mat-form-field>

    @if (errorMessage()) {
      <p class="form-error" role="alert">{{ errorMessage() }}</p>
    }

    <button
      mat-flat-button
      color="primary"
      type="submit"
      class="w-full min-h-11"
      [disabled]="isSubmitting()"
    >
      @if (isSubmitting()) {
        <mat-progress-spinner diameter="18" mode="indeterminate" aria-label="Submitting" />
      }
      <span class="inline-flex items-center gap-2">Sign in</span>
    </button>
  </form>
  <p class="auth-footer">
    New to CareerPilot? <a routerLink="/auth/register">Create an account</a>
  </p>
</cp-auth-layout>
