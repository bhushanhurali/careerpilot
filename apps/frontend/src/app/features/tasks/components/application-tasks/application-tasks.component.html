<section class="my-cp-lg grid gap-cp-md" aria-label="Application tasks">
  <div class="section-header cp-record-heading flex flex-wrap items-center justify-between gap-3">
    <h2>Tasks</h2>
    <button #addButton mat-stroked-button type="button" (click)="openForm()">
      <mat-icon>add</mat-icon>
      Add task
    </button>
  </div>
  <cp-task-list
    [manageable]="true"
    (editTask)="openForm($event)"
    (deleteTask)="confirmDelete($event)"
  />
</section>
