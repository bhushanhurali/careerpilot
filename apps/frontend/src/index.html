<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>JobThreader</title>
    <base href="/" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta
      name="description"
      content="Track job applications, manage interviews and follow-ups, and compare resume skills with job descriptions."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="JobThreader" />
    <meta property="og:description" content="Your entire job search, connected." />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Set the preference before global styles and Angular render.
      (() => {
        let preference;
        try {
          preference = localStorage.getItem('careerpilot-theme');
        } catch {
          // Storage may be blocked; follow the OS in that case.
        }
        const theme = preference === 'light' || preference === 'dark' ? preference : 'system';
        document.documentElement.dataset.theme = theme;
        if (theme !== 'system') document.querySelector('meta[name="color-scheme"]').content = theme;
      })();
    </script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  </head>
  <body>
    <cp-root></cp-root>
  </body>
</html>
